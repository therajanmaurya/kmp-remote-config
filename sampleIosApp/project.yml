# XcodeGen spec — the source of truth for sampleIosApp.xcodeproj.
#
# The README that used to sit here argued against committing an `.xcodeproj` because it is
# "a generated binary-ish file with absolute paths and a project UUID, and hand-writing one
# produces a file that opens and then fails in ways nobody can debug". That objection is
# correct about HAND-WRITING one, and it is answered by generating it instead: this file is the
# reviewable source, `xcodegen generate` produces the project deterministically, and the result
# is verified by actually building and running it rather than by being looked at.
#
# The project IS committed as well, so that evaluating the SDK does not start with
# `brew install xcodegen`. Regenerate after editing this file:
#
#     cd sampleIosApp && xcodegen generate
#
name: sampleIosApp
options:
  bundleIdPrefix: com.mobilebytesensei
  # Relative, so the project carries no path from the machine that generated it — the specific
  # failure mode the old README warned about.
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.38.0

settings:
  base:
    # Compose Multiplatform 1.12 supports iOS 13+; 15.0 is the floor Xcode 26 will still build a
    # simulator slice for without deprecation noise.
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO  # the Gradle build phase writes outside the sandbox

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: rconfig
        # Compose Multiplatform REFUSES to start without this — `PlistSanityCheck` throws
        # kotlin.IllegalStateException at first composition, so the app builds clean, is
        # installed, launches, and dies on a SIGABRT back to the home screen. It unlocks
        # ProMotion's full 120Hz range; without it iOS caps a non-declaring app at 60.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilebytesensei.rconfig
        # Where `embedAndSignAppleFrameworkForXcode` puts the framework it builds. The
        # $(CONFIGURATION)/$(SDK_NAME) tail is why one project works for both simulator and
        # device without a second target.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../sample/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - sample
        # Signing is left at Xcode's defaults on purpose. Pinning CODE_SIGNING_ALLOWED=NO here
        # would make the simulator build in CI pass and a consumer's build onto their own phone
        # impossible — so the simulator verification passes those flags on the xcodebuild
        # command line instead of baking them into the project.
    preBuildScripts:
      - name: Build Kotlin framework
        # `cd` to the Gradle root: $SRCROOT is sampleIosApp/, the build lives one level up.
        script: |
          cd "$SRCROOT/.."
          ./gradlew :sample:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
