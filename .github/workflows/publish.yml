# Publish Workflow — delegates to mbl-actionhub reusable publish workflow
#
# Triggers:
#   - workflow_dispatch (manual, optional module / version override)
#   - dispatched by publish-trigger.yml on a push to the `release` branch
#
# ── NO cron schedules (removed 2026-10-05) ────────────────────────────────────
# This workflow used to carry `schedule:` entries for every Monday 00:00 UTC and
# the 1st of each month. On a repo whose org already provides publishing secrets
# via `secrets: inherit`, a cron is an unattended release of whatever happens to
# be committed. Releases here are deliberate: a human merges to `release`, or
# dispatches this workflow.
#
# Version source of truth: gradle.properties -> kmpremoteconfig.version
#   The committed value is what gets published. `verify-against-maven` fails the
#   run if Maven Central is already at or ahead of that version, which is the
#   guard against re-publishing a burned coordinate.

name: Publish

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Specific module to publish (leave empty for both cmp-remote-config modules)'
        required: false
        type: string
      version:
        description: 'Override version (leave empty to use kmpremoteconfig.version from gradle.properties)'
        required: false
        type: string

permissions:
  contents: write          # release creation, tag push
  pull-requests: write     # retained for the reusable workflow's interface

jobs:
  publish:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-kmp-library.yml@v1.9.1
    with:
      module-pattern: 'cmp-'
      module: ${{ inputs.module || '' }}
      group-id: 'io.github.mobilebytelabs'
      # Must name a module THIS repo actually publishes. It was 'cmp-bubble',
      # inherited from KmpToolkit — a module that does not exist here, so the
      # "fail if Maven is ahead" sanity check was comparing our version against
      # an unrelated artifact's and could never catch a real collision.
      artifact-id: 'cmp-remote-config'
      version: ${{ inputs.version || '' }}
      gradle-properties-key: 'kmpremoteconfig.version'
      verify-against-maven: true
      # ── Auto-bump DISABLED ────────────────────────────────────────────────
      # next-bump-type: 'patch' turned 4.0.0-alpha01 into 4.0.1 — it drops the
      # prerelease suffix, which silently promotes the alpha line to a release
      # line. This repo stays on 4.0.0-alphaNN until the control plane ships, and
      # picking the next suffix is a human decision. Bump by hand on `dev`.
      bump-after-release: false
      java-version: '21'
      java-distribution: 'zulu'
      sonatype-host: 'CENTRAL_PORTAL'
      create-github-release: true
      # No module here declares a `gradlePlugin` block — cmp-firebase-gradle-plugin
      # stayed in KmpToolkit. The job reported success having published nothing,
      # which is a false green on the release summary.
      publish-gradle-plugin-portal: false
    secrets: inherit
