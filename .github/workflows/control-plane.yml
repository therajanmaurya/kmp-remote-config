# Control-plane tests — the SQL assertions, the Deno route suites, and the wire contract.
#
# None of this ran in CI before (review finding I6). Spec §13.1 asks for the RLS negative
# tests "run in CI against a seeded database", and §13.4's entire point is that a commit
# changing the wire shape without changing the SDK model "fails in CI". Until this existed,
# the highest-risk surface in the product — cross-tenant isolation — was protected only by
# whoever remembered to run run.sh locally.
name: Control plane

on:
  push:
    branches: [dev, release]
    paths:
      - 'supabase/**'
      - 'contract/**'
      - 'cmp-remote-config/src/**Test/**'
      - '.github/workflows/control-plane.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'contract/**'
      - 'cmp-remote-config/src/**Test/**'
      - '.github/workflows/control-plane.yml'

permissions:
  contents: read

jobs:
  sql:
    name: SQL assertions (RLS, schema, tenancy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts Postgres + applies every migration in supabase/migrations in order.
      - name: Start local stack
        run: supabase start

      # The suite is self-contained: harness proves the hardening posture, then each table's
      # invariants, then cross-tenant isolation last because it asserts the combined effect.
      - name: Run SQL assertions
        run: bash supabase/tests/run.sh

      # A gate that cannot fail proves nothing. Widening one policy MUST break rls_test —
      # if this step succeeds, the isolation suite has gone blind and the build should fail.
      - name: Prove the RLS gate can fail (mutation check)
        run: |
          set -uo pipefail
          DB=$(bash supabase/tests/psql.sh --print-url)
          psql "$DB" -q -c "DROP POLICY config_select ON public.config;
                            CREATE POLICY config_select ON public.config
                              FOR SELECT TO authenticated USING (true);"
          if bash supabase/tests/psql.sh supabase/tests/rls_test.sql >/dev/null 2>&1; then
            echo "::error::rls_test PASSED with config_select widened to USING(true) — the isolation suite cannot fail and is therefore worthless"
            exit 1
          fi
          echo "✓ mutation correctly detected"
          # RESTORE. Without this the e2e steps below run against a database whose
          # config_select is still USING(true) — the mutation would silently become the
          # state under test, which is worse than not checking at all.
          psql "$DB" -q -c "DROP POLICY config_select ON public.config;
                            CREATE POLICY config_select ON public.config
                              FOR SELECT TO authenticated
                              USING (public.is_app_member(app_id));"
          bash supabase/tests/psql.sh supabase/tests/rls_test.sql >/dev/null
          echo "✓ policy restored and rls_test green again"

      # End-to-end against the real routes. These carry the C2 cross-tenant regression guard
      # and the revoked-key / Vary / schedule-window checks that no unit test can pin.
      - name: Serve functions
        run: |
          nohup supabase functions serve --no-verify-jwt > /tmp/fn.log 2>&1 &
          until grep -qi "Serving functions" /tmp/fn.log; do sleep 1; done
      - name: Seed + end-to-end
        run: |
          bash supabase/tests/seed_local.sh
          bash supabase/tests/e2e_configs.sh
          bash supabase/tests/e2e_events.sh
          bash supabase/tests/e2e_rate_limit.sh

      - name: Stop stack
        if: always()
        run: supabase stop

  deno:
    name: Edge Function suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every route
        run: |
          for f in supabase/functions/*/index.ts; do deno check "$f"; done
      - name: Run suites
        run: deno test --allow-env --allow-read supabase/functions/

  contract:
    name: Wire contract (Deno ↔ Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # Both halves must assert the SAME fixture. This pairing is the only thing that makes
      # the one-repo topology worth anything: change the response shape without changing the
      # Kotlin model and exactly one of these two steps fails.
      - name: Deno half
        run: deno test --allow-env --allow-read supabase/functions/v1-configs/contract_test.ts
      - name: Kotlin half
        run: ./gradlew :cmp-remote-config:jvmTest --tests '*ContractFixture*'

  live-sdk-contract:
    name: Live SDK contract (deployed plane ↔ shipped model)
    runs-on: ubuntu-latest
    # Only on pushes to the default branch and on demand. It seeds and removes sentinel rows on
    # the DEPLOYED project, so running it per-PR would have many forks mutating one plane.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The job the `contract` job above cannot do. That one proves the SDK model agrees with a
      # fixture a human committed; this proves the DEPLOYED function agrees with it too. A
      # migration applied to prod but never reflected in the contract is invisible to every
      # local suite, because a local stack is built from those same committed migrations.
      - name: Fetch live and parse with the shipped model
        env:
          # Resolved by the script from the vault when run locally. In CI the value arrives as a
          # repo secret, propagated ONLY by `/secrets sync-to-ci` (RULE-SECRETS-VAULT-001) —
          # never `gh secret set` against this repo by hand.
          RC_SERVICE_ROLE_KEY: ${{ secrets.KMP_REMOTE_CONFIG_SUPABASE_SERVICE_ROLE_KEY }}
        run: bash supabase/tests/e2e_sdk_contract.sh
