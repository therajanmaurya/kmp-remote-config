# =============================================================================
# kmp-remote-config — Single version source of truth
# Bump this ONE value to release both SDK modules together.
#
# Line continues cmp-remote-config's history in KmpToolkit (last published there:
# 3.5.28). The 4.x line is a BREAKING change for consumers:
# `remoteConfig { supabaseUrl/supabaseKey }` is replaced by a single
# `publishableKey`. The artifact COORDINATES are deliberately unchanged
# (io.github.mobilebytelabs:cmp-remote-config[-compose]) so a consumer migrates a
# version, not a dependency id.
#
# PUBLISHED FROM HERE SO FAR:
#   4.0.0-alpha01 — 2026-10-05, UNINTENTIONALLY. The genesis push matched
#     publish-trigger.yml's old `dev` + `cmp-*/**` filter and released both
#     artifacts to Maven Central unattended. Permanent (Central never deletes).
#     Contents are the functional KmpToolkit 3.5.28 code, NOT the reworked API.
#
# Stay on the 4.0.0-alphaNN line until the control plane ships; 4.0.0 final is the
# first release that actually has publishable keys. Pick each suffix BY HAND —
# bump-after-release is off in publish.yml precisely because `patch` turned
# 4.0.0-alpha01 into 4.0.1 and dropped the prerelease suffix.
# =============================================================================
kmpremoteconfig.version=5.0.0

# Maven Central Publishing (vanniktech 0.36.0 reads these from gradle.properties)
SONATYPE_HOST=CENTRAL_PORTAL
# ⚠ AUTOMATIC_RELEASE=true means a publish run does NOT stage-and-wait: it closes
# and RELEASES the staging repository, and a Central release is irreversible. The
# only gate is therefore the trigger itself — a push to the `release` branch, or a
# manual workflow_dispatch. Nothing downstream of that asks for confirmation.
SONATYPE_AUTOMATIC_RELEASE=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Dokka — opt into v2 plugin (DokkaExtension + dokkaGenerate task). Required by
# the DokkaConventionPlugin in build-logic/convention/.
# V2Enabled (not V2EnabledWithHelpers): the migration is complete — DokkaConventionPlugin
# uses the V2 DokkaExtension API and the V2 `dokkaGeneratePublicationHtml` task, and no V1
# compatibility shim is referenced anywhere. The helpers only printed a migration notice on
# every project configure.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Compose Multiplatform
org.jetbrains.compose.experimental.macos.enabled=true
# Allow Homebrew JDK distributions for `createDistributable` (developer-machine workflow).
# CI release pipelines use a vendor-pinned Corretto/Temurin JDK where this flag is a no-op.
compose.desktop.packaging.checkJdkVendor=false
