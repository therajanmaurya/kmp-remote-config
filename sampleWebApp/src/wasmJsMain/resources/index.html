<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rconfig sample</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        /* Compose renders into this element — the id must match ComposeViewport's
           viewportContainerId, or the app mounts nowhere and the page stays blank. */
        #composeTarget { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="composeTarget"></div>
    <script src="sampleWebApp.js"></script>
</body>
</html>
